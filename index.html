<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng dẫn tạo Fixed Menu</title>
    <style>
        /* Reset margin mặc định của trình duyệt */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }


        .navbar {
            overflow: hidden;
            background-color: #333;
            position: fixed; 
            top: 0;       
            width: 100%;    
            z-index: 1000;   
        }

   
        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        .main {
            padding: 16px;
            margin-top: 50px; 
            height: 1500px;   
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#news">News</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
    </div>

    <!-- Nội dung chính -->
    <div class="main">
        <h1>Fixed Top Menu</h1>
        <h2>Scroll this page to see the effect</h2>
        <h2>The navigation bar will stay at the top of the page while scrolling</h2>
        <p>Some text some text some text some text...</p>
        <p>Some text some text some text some text...</p>
        <p>Cuộn xuống dưới để kiểm tra thanh Menu có bị trôi theo hay không.</p>
    </div>

</body>
</html>
