<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Căn giữa phần tử hoàn hảo với Flexbox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      min-height: 100vh;
      display: flex;            /* Dòng 1: Kích hoạt Flexbox */
      justify-content: center; /* Dòng 2: Căn giữa theo trục ngang */
      align-items: center;     /* Dòng 3: Căn giữa theo trục dọc */
      background-color: #f0f2f5;
    }

    .center-card {
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .center-card h3 {
      color: #1a73e8;
      margin-bottom: 12px;
    }

    .center-card p {
      color: #5f6368;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="center-card">
      <h3>Căn giữa hoàn hảo!</h3>
      <p>Phần tử này nằm chính giữa khung nhìn màn hình.</p>
    </div>
  </div>

</body>
</html>
