<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        /* CSS căn chỉnh bảng cho đẹp mắt và dễ nhìn */
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #cccccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Điện thoại iPhone 15 Pro</td>
                <td>28.990.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>35.500.000 VNĐ</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Tai nghe Bluetooth Sony</td>
                <td>3.200.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Logitech</td>
                <td>2.100.000 VNĐ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
